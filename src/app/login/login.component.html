<div class="login-container">

  <!-- HEADER -->

  <header class="login-header">

    <h1>AGROMARKET</h1>

  </header>

  

  <form
    class="login-form"
    (ngSubmit)="iniciarSesion()"
    #loginForm="ngForm"
  >

    

    <div class="regresar">

      <button
        type="button"
        class="btn-regresar"
        (click)="regresar()"
      >

        <img
          src="https://cdn-icons-png.flaticon.com/512/6097/6097933.png"
          alt="icono regresar"
          class="icono"
        />

      </button>

    </div>

    

    <div class="login-imagen">

      <img
        src="https://i.pinimg.com/736x/ea/20/b5/ea20b533ba9910d17a5d424ea85facd3.jpg"
        alt="Imagen de login"
      />

    </div>

   

    <div class="form-group">

      <label for="correo">
        Correo electrónico
      </label>

      <input
        type="email"
        id="correo"
        placeholder="Ingresa tu correo"
        name="correo"
        required
        [(ngModel)]="correo"
        #correoInput="ngModel"
      />

      <div
        class="error"
        *ngIf="correoInput.invalid && correoInput.touched"
      >

        Ingresa un correo válido

      </div>

    </div>


    <div class="form-group">

      <label for="password">
        Contraseña
      </label>

      <input
        type="password"
        id="password"
        placeholder="Ingresa tu contraseña"
        name="password"
        required
        maxlength="20"
        [(ngModel)]="password"
        #passwordInput="ngModel"
      />

      <div
        class="error"
        *ngIf="passwordInput.invalid && passwordInput.touched"
      >

        Ingresa tu contraseña

      </div>

    </div>

   

    <div class="forgot-password">

      <a
        href="#"
        (click)="recuperarContrasena($event)"
      >

        ¿Olvidaste tu contraseña?

      </a>

    </div>

    <!-- BOTONES -->

    <div class="button-group">

      <button
        type="button"
        class="btn crear"
        (click)="irARegistrar()"
        [disabled]="correo !== '' && password !== ''"
      >

        Crear cuenta

      </button>

      <button
        type="submit"
        class="btn iniciar"
        [disabled]="loginForm.invalid"
      >

        Iniciar sesión

      </button>

    </div>

  </form>

</div>
