<div class="agregar-producto-container">

  <header class="header">
    <h1>AGROMARKET</h1>

    <div class="contenedor-icono-verprod" (click)="mostrar = !mostrar">
      <button class="btn-ver-productos">
        <img
          src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png"
          alt="productos"
        />
        <span class="texto-verprod">productos</span>
      </button>
    </div>
  </header>

  <main class="main-content">

    <section class="form-section">

      <div class="form-container">

        <div class="titulo-con-botones">
          <button class="btn-regresar" (click)="regresar()">
            <img
              src="https://cdn-icons-png.flaticon.com/512/6097/6097933.png"
              alt="icono agricultor"
              class="icono"
            />
          </button>

          <h2>AGRICULTOR</h2>
        </div>

      
        <div class="panel-productos panel-agricultor" [class.panel-abierto]="mostrar">
          <h3 class="titulo-panel">Productos Agregados</h3>

          <div *ngIf="productos.length === 0" class="sin-productos">
            No hay productos todavía
          </div>

          <div class="producto-item-agricultor" *ngFor="let p of productos">
            <p><strong>{{ p.nombre }}</strong></p>
            <p>Cantidad: {{ p.cantidad }} kg</p>
            <p>Precio: {{ p.precio }}</p>
            <p>Tipo: {{ p.tipo }}</p>
          </div>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre producto</label>
          <input type="text" id="nombre" maxlength="30"
          required (input)="soloLetras($event)"
          [(ngModel)]="nombre" name="nombre" />
        </div>

        <div class="form-group">
          <label for="cantidad">Cantidad Kg</label>
          <input type="text" id="cantidad" maxlength="5"
          required (input)="soloNumeros($event)"
          [(ngModel)]="cantidad" name="cantidad" />
        </div>

        <div class="form-group">
          <label for="precio">Precio Kg</label>
          <input type="text" id="precio" maxlength="10"
          required (input)="soloDecimales($event)"
          [(ngModel)]="precio" name="precio" />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo</label>
          <select id="tipo" [(ngModel)]="tipo" name="tipo">
            <option value="">Seleccionar...</option>
            <option value="grano">Grano</option>
            <option value="tuberculo">Tubérculo</option>
            <option value="fruta">Fruta</option>
            <option value="hortaliza">Hortaliza</option>
            <option value="otros">Otros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="imagen">Cargar imagen</label>
          <input
            type="file"
            id="imagen"
            accept="image/*"
            (change)="onFileSelected($event)"
          />
        </div>

        <div class="preview" *ngIf="imagenPreview">
          <img [src]="imagenPreview" alt="" class="preview-img" />
        </div>

        <div class="botones">
          <button type="button" class="guardar" (click)="guardar()">Guardar</button>
          <button type="button" class="cancelar" (click)="cancelar()">Cancelar</button>
        </div>

        <p class="mensaje-exito" *ngIf="mensajeExito">{{ mensajeExito }}</p>

      </div>
    </section>

    <section class="imagen-section">
      <div class="imagen-container">
        <img
          src="https://www.cocinaconalegria.com/wp-content/uploads/2022/05/que-son-los-productos-organicos.jpg"
          alt="imagen"
        />
      </div>
    </section>

  </main>
</div>
